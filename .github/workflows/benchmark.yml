name: benchmark-capacity

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/v2-3-batch-analysis"

jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install requests python-docx pypdf
      - run: python scripts/benchmark_capacity.py
