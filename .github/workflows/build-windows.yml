name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q app run.py
      - name: Build single EXE
        shell: pwsh
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --collect-submodules app
          --hidden-import app.ui
          --hidden-import app.main
          --hidden-import win32com.client
          --hidden-import pythoncom
          --hidden-import pywintypes
          --name PublicLanguageChecker
          --add-data "data;data"
          run.py
      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\PublicLanguageChecker.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE self-test failed with exit code $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PublicLanguageChecker-Windows
          path: dist/PublicLanguageChecker.exe
